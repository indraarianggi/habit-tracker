<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · Activity Grid (B, bento)</title>
<!--
  PROTOTYPE, throwaway. Wipe me after the ticket "Activity Grid look" is resolved.

  Follow-up to index.html: the user picked variant B (fit-to-screen grid, floating tooltip)
  but disliked its visual style. This restyles B as a bento layout: flat pastel tiles, big
  radii, minimal chrome, cheerful colours. Behaviour is unchanged from B.

  The stat tiles (Focused / Check-ins / Active days / per-Habit list) are illustrative only,
  to make the bento composition readable. Real stats belong to "Habit lifecycle and stats".

  Open directly (file://) or:  python3 -m http.server -d <this folder>
-->
<style>
:root{
  color-scheme:light;
  --outer:oklch(0.93 0.025 95);
  --bg:oklch(0.973 0.02 95);
  --surface:oklch(1 0.004 95);
  --ink:oklch(0.24 0.03 285);
  --muted:oklch(0.5 0.03 285);
  --line:oklch(0 0 0 / 0.08);
  --shadow-border:0 0 0 1px oklch(0 0 0 / .05),0 1px 2px -1px oklch(0 0 0 / .06),0 2px 4px 0 oklch(0 0 0 / .04);
  --tl:.93;--tc:.075;            /* pastel tile lightness / chroma */
  --chip-l:.9;--chip-c:.09;
  --l0:oklch(0.955 0.012 95);
  --L1:.92;--C1:.06; --L2:.84;--C2:.12; --L3:.73;--C3:.17; --L4:.60;--C4:.20;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --outer:oklch(0.12 0.01 285);--bg:oklch(0.17 0.015 285);--surface:oklch(0.23 0.02 285);
    --ink:oklch(0.96 0.01 285);--muted:oklch(0.74 0.02 285);--line:oklch(1 0 0 / 0.1);
    --shadow-border:0 0 0 1px oklch(1 0 0 / .08);
    --tl:.32;--tc:.07;--chip-l:.42;--chip-c:.1;
    --l0:oklch(0.31 0.015 285);
    --L1:.40;--C1:.07; --L2:.52;--C2:.12; --L3:.66;--C3:.17; --L4:.80;--C4:.19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --outer:oklch(0.12 0.01 285);--bg:oklch(0.17 0.015 285);--surface:oklch(0.23 0.02 285);
  --ink:oklch(0.96 0.01 285);--muted:oklch(0.74 0.02 285);--line:oklch(1 0 0 / 0.1);
  --shadow-border:0 0 0 1px oklch(1 0 0 / .08);
  --tl:.32;--tc:.07;--chip-l:.42;--chip-c:.1;
  --l0:oklch(0.31 0.015 285);
  --L1:.40;--C1:.07; --L2:.52;--C2:.12; --L3:.66;--C3:.17; --L4:.80;--C4:.19;
}

*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--outer);color:var(--ink);font:14px/1.4 ui-rounded,"SF Pro Rounded","Nunito","Varela Round",ui-sans-serif,system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tnum{font-variant-numeric:tabular-nums}
h1{font-size:26px;line-height:1.1;margin:0;font-weight:750;letter-spacing:-.01em;text-wrap:balance}
p{text-wrap:pretty}

.shell{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);padding:0 16px 40px;box-shadow:0 0 0 1px var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:22px 4px 12px}
.tag{font-size:11px;color:var(--muted)}

/* habit filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-border);font-size:14px;font-weight:600;
  transition-property:background-color,color,scale;transition-duration:150ms;transition-timing-function:ease-out}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:active{scale:.96}
.chip[aria-pressed="true"]{background:oklch(var(--chip-l) var(--chip-c) var(--h,150));box-shadow:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:oklch(.7 .17 var(--h,150));flex:none}

/* bento */
#view{--hue:160;
  --c1:oklch(var(--L1) var(--C1) var(--hue));--c2:oklch(var(--L2) var(--C2) var(--hue));
  --c3:oklch(var(--L3) var(--C3) var(--hue));--c4:oklch(var(--L4) var(--C4) var(--hue))}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:span 2}
.tall{grid-row:span 2}
/* tile radius 28 with 16 padding -> nested surfaces use 12 */
.tile{border-radius:28px;padding:16px;background:oklch(var(--tl) var(--tc) var(--th,95));min-width:0}
.tile.white{background:var(--surface);box-shadow:var(--shadow-border)}
.k{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.num{font-size:32px;line-height:1.05;font-weight:750;letter-spacing:-.02em;margin-top:6px}
.num small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.cap{font-size:12px;color:var(--muted);margin-top:4px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.thead .ttl{font-size:16px;font-weight:700}
.thead .sub{font-size:12px;color:var(--muted)}

/* segmented control: outer 12 = inner 8 + padding 4 */
.seg{display:inline-flex;padding:4px;border-radius:12px;background:oklch(0.5 0.03 285 / .1)}
.seg button{position:relative;height:28px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);
  transition-property:background-color,color,scale;transition-duration:150ms;transition-timing-function:ease-out}
.seg button::after{content:"";position:absolute;inset:-8px 0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-border)}
.seg button:active{scale:.96}

/* grid */
.ga{--r:3px;display:grid;grid-template-columns:28px auto;grid-template-rows:16px auto;width:max-content}
.ga-months{grid-column:2;position:relative;height:16px;font-size:10px;line-height:1;color:var(--muted)}
.ga-months span{position:absolute;top:0;white-space:nowrap}
.ga-wd{display:grid;grid-template-rows:repeat(7,var(--size));gap:var(--gap);font-size:10px;line-height:1;color:var(--muted)}
.ga-wd span{display:flex;align-items:center;white-space:nowrap}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--size));grid-auto-columns:var(--size);gap:var(--gap);cursor:pointer;touch-action:pan-x pan-y}
.c{display:grid;place-items:center;border-radius:var(--r);font-style:normal;font-size:10px;font-weight:600;line-height:1;position:relative}
.c.l0{background:var(--l0);color:var(--muted)}
.c.l1{background:var(--c1);color:oklch(0.4 0.06 var(--hue))}
.c.l2{background:var(--c2);color:oklch(0.3 0.08 var(--hue))}
.c.l3{background:var(--c3);color:oklch(0.22 0.06 var(--hue))}
.c.l4{background:var(--c4);color:#fff}
:root[data-theme="dark"] .c.l3,:root[data-theme="dark"] .c.l4{color:oklch(0.16 0.03 var(--hue))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c.l3,:root:not([data-theme="light"]) .c.l4{color:oklch(0.16 0.03 var(--hue))}}
.c.void{background:transparent}
.c.sel{z-index:1;box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ink)}

.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:14px;font-size:11px;color:var(--muted)}
.legend .c{width:12px;height:12px;border-radius:4px}
.legend span:first-child{margin-right:2px}.legend span:last-child{margin-left:2px}
.th{text-align:right;font-size:11px;color:var(--muted);margin-top:4px}

/* per-habit list inside the tall tile */
.hl{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.hl li{display:grid;gap:5px;font-size:12px}
.hl .row{display:flex;align-items:center;gap:6px}
.hl .row span:last-child{margin-left:auto;font-weight:650}
.hl .bar{height:8px;border-radius:4px;background:oklch(0 0 0 / .07)}
.hl .bar i{display:block;height:100%;border-radius:4px;background:oklch(.7 .17 var(--h,150))}
:root[data-theme="dark"] .hl .bar{background:oklch(1 0 0 / .1)}

/* floating tooltip */
.pop{position:fixed;z-index:40;pointer-events:none;max-width:230px;padding:10px 12px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:12px;box-shadow:0 8px 24px oklch(0 0 0 / .25)}
.pop[hidden]{display:none}
.pop .p-date{opacity:.7;margin-bottom:2px}
.pop .p-main b{font-weight:700}
.pop .p-row{display:flex;align-items:center;gap:6px;margin-top:5px}
.pop .p-row span:last-child{margin-left:auto;padding-left:12px}
.note{font-size:11px;color:var(--muted);margin:10px 4px 0}

/* knobs (prototype chrome) */
.knobs{margin-top:16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-border)}
.knobs summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.knobs summary::-webkit-details-marker{display:none}
.knobs summary::after{content:"+"}
.knobs[open] summary::after{content:"–"}
.knob-grid{padding:0 16px 14px;display:grid;gap:10px}
.knob{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><h1>Activity</h1><span class="tag">PROTOTYPE · fake data</span></header>
  <div class="chips" id="chips"></div>
  <main id="view"></main>
  <details class="knobs"><summary>Prototype knobs</summary><div class="knob-grid" id="knobGrid"></div></details>
</div>
<div class="pop" id="pop" hidden></div>

<script>
/* ---------- fake data (same generator as index.html) ---------- */
const HABITS=[
  {id:'read',  name:'Reading', hue:220,p:.55,dur:[15,20,30,30,45]},
  {id:'code',  name:'Coding',  hue:285,p:.50,dur:[25,25,25,50,50,75]},
  {id:'gym',   name:'Workout', hue:40, p:.38,dur:[30,45,45,60]},
  {id:'guitar',name:'Guitar',  hue:350,p:.30,dur:[10,15,20,25]},
];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const TODAY=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const TODAY_KEY=keyOf(TODAY);
const fmt=m=>m<60?m+'m':Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':'');
const fmtDate=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DATA=new Map();
(function gen(){
  const r=rng(20260919);
  for(let i=419;i>=0;i--){
    const d=addDays(TODAY,-i),dow=d.getDay(),we=dow===0||dow===6;
    if((i>=150&&i<=163)||(i>=41&&i<=45)) continue;
    const wave=0.8+0.45*Math.sin(i/21)+0.15*Math.sin(i/6);
    const list=[];
    for(const h of HABITS){
      const p=h.p*wave*(h.id==='gym'&&we?1.5:1)*(h.id==='code'&&we?.5:1);
      if(r()<Math.min(.9,p)){
        const n=1+(r()<.35)+(r()<.12);
        for(let k=0;k<n;k++) list.push({h:h.id,m:h.dur[Math.floor(r()*h.dur.length)]});
      }
    }
    if(r()<.03) list.push({h:'code',m:90+Math.floor(r()*30)});
    if(list.length) DATA.set(keyOf(d),list);
  }
})();

/* ---------- state (mirrored into the URL) ---------- */
const P=new URLSearchParams(location.search);
const S={
  scale:P.get('scale')||'relative', ws:P.get('ws')||'1', theme:P.get('theme')||'auto',
  fcolor:P.get('fcolor')||'habit', tip:P.get('tip')||'breakdown', hue:P.get('hue')||'160',
  habit:P.get('habit')||'all', range:Number(P.get('range')||3), sel:TODAY_KEY, _cells:[], _pitch:0,
};
let HOVER=null;
const KNOBS=[
  {key:'scale', label:'Shading',            opts:[['fixed','Fixed'],['relative','Relative']]},
  {key:'hue',   label:'Grid colour (All)',  opts:[['160','Mint'],['285','Grape'],['25','Coral'],['235','Sky']]},
  {key:'fcolor',label:'Single-habit colour',opts:[['habit','Habit hue'],['same','Same as All']]},
  {key:'ws',    label:'Week starts',        opts:[['1','Mon'],['0','Sun']]},
  {key:'theme', label:'Theme',              opts:[['auto','Auto'],['light','Light'],['dark','Dark']]},
  {key:'tip',   label:'Tooltip',            opts:[['basic','Basic'],['breakdown','+ Habits']]},
];

/* ---------- domain helpers ---------- */
const alignStart=d=>addDays(d,-((d.getDay()-Number(S.ws)+7)%7));
function buildWeeks(start,end){const w=[];for(let d=start;d<=end;d=addDays(d,7)){w.push([0,1,2,3,4,5,6].map(i=>addDays(d,i)))}return w}
function info(key){
  const all=DATA.get(key)||[];
  const es=S.habit==='all'?all:all.filter(e=>e.h===S.habit);
  const by={};let total=0;
  for(const e of es){total+=e.m;(by[e.h]??={m:0,n:0});by[e.h].m+=e.m;by[e.h].n++}
  return {total,count:es.length,by};
}
function scaleInfo(){
  let th;
  if(S.scale==='fixed') th=[29,59,119];
  else{
    const v=[...DATA.keys()].map(k=>info(k).total).filter(x=>x>0).sort((a,b)=>a-b);
    const q=p=>v.length?v[Math.min(v.length-1,Math.floor(p*v.length))]:0;
    th=[q(.25),q(.5),q(.75)];
  }
  return {th,lvl:t=>t<=0?0:t<=th[0]?1:t<=th[1]?2:t<=th[2]?3:4};
}
const hueAll=()=>Number(S.hue);
const hue=()=>S.habit==='all'||S.fcolor==='same'?hueAll():HABITS.find(h=>h.id===S.habit).hue;

/* ---------- markup ---------- */
function legend(sc){
  const [a,b,c]=sc.th;
  const rg=(lo,hi)=>hi>=lo?(lo===hi?lo:lo+'–'+hi):'–';
  return `<div class="legend"><span>Less</span>${[0,1,2,3,4].map(l=>`<i class="c l${l}"></i>`).join('')}<span>More</span></div>
  <div class="th tnum">min/day: 0 · ${rg(1,a)} · ${rg(a+1,b)} · ${rg(b+1,c)} · ${c+1}+</div>`;
}
function wdLabels(){
  const N=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let h='';
  for(let r=0;r<7;r++){const dow=(Number(S.ws)+r)%7;h+=`<span>${[1,3,5].includes(dow)?N[dow]:''}</span>`}
  return h;
}
function monthLabels(weeks,pitch){
  let out='',last=-99;
  weeks.forEach((w,i)=>{
    const f=w.find(d=>d.getDate()===1);
    if(f&&(i-last)*pitch>=28){out+=`<span style="left:${i*pitch}px">${f.toLocaleDateString('en-GB',{month:'short'})}</span>`;last=i}
  });
  return out;
}
function makeGrid(weeks,{maxEnd,statsFrom,showNum}){
  const sc=scaleInfo(),cells=[],st={count:0,min:0,days:0,span:0,by:{}};let html='';
  for(const w of weeks)for(const d of w){
    if(d>maxEnd||d>TODAY){cells.push(null);html+='<i class="c void"></i>';continue}
    const k=keyOf(d),i=info(k);
    if(d>=statsFrom){
      st.count+=i.count;st.min+=i.total;st.span++;if(i.total)st.days++;
      for(const h in i.by)st.by[h]=(st.by[h]||0)+i.by[h].m;
    }
    cells.push(k);
    html+=`<i class="c l${sc.lvl(i.total)}${k===S.sel?' sel':''}">${showNum?d.getDate():''}</i>`;
  }
  return {html,cells,st,sc};
}

function render(){
  syncControls();
  const view=$('#view');view.style.setProperty('--hue',hue());
  const m=S.range;
  const start=new Date(TODAY.getFullYear(),TODAY.getMonth()-m,TODAY.getDate()+1);
  const weeks=buildWeeks(alignStart(start),TODAY);
  const n=weeks.length;
  const avail=view.clientWidth-32-28;               // tile padding 2*16, weekday label column 28
  let gap=3,size=Math.floor((avail-(n-1)*gap)/n);
  if(size<10){gap=2;size=Math.floor((avail-(n-1)*gap)/n)}
  if(size<6){gap=1;size=Math.floor((avail-(n-1)*gap)/n)}
  size=Math.min(size,30);
  const r=Math.max(2,Math.round(size*.32));
  const g=makeGrid(weeks,{maxEnd:TODAY,statsFrom:start,showNum:size>=22});
  S._cells=g.cells;S._pitch=size+gap;
  const pitch=size+gap,st=g.st;
  const seg=[3,6,12].map(v=>`<button data-range="${v}" aria-pressed="${v===m}">${v}m</button>`).join('');
  const label=S.habit==='all'?'All habits':HABITS.find(h=>h.id===S.habit).name;
  const per=HABITS.filter(h=>st.by[h.id]).sort((a,b)=>st.by[b.id]-st.by[a.id]);
  const top=per.length?st.by[per[0].id]:1;
  const hl=per.map(h=>`<li><div class="row"><span class="dot" style="--h:${h.hue}"></span><span>${h.name}</span><span class="tnum">${fmt(st.by[h.id])}</span></div><div class="bar"><i style="--h:${h.hue};width:${Math.round(st.by[h.id]/top*100)}%"></i></div></li>`).join('');
  view.innerHTML=`<div class="bento">
    <section class="tile white span2">
      <div class="thead"><div><div class="ttl">${label}</div><div class="sub">last ${m} months</div></div><div class="seg">${seg}</div></div>
      <div class="ga" style="--size:${size}px;--gap:${gap}px;--r:${r}px">
        <div class="ga-months" style="width:${n*pitch}px">${monthLabels(weeks,pitch)}</div>
        <div class="ga-wd">${wdLabels()}</div>
        <div class="grid" data-size="${size}" data-gap="${gap}" data-n="${n}">${g.html}</div>
      </div>
      ${legend(g.sc)}
    </section>
    <section class="tile tall" style="--th:95">
      <div class="k">Focused</div>
      <div class="num tnum">${fmt(st.min)}</div>
      <div class="cap">in ${m} months</div>
      <ul class="hl">${hl}</ul>
    </section>
    <section class="tile" style="--th:350">
      <div class="k">Check-ins</div><div class="num tnum">${st.count}</div>
    </section>
    <section class="tile" style="--th:225">
      <div class="k">Active days</div><div class="num tnum">${st.days}<small> / ${st.span}</small></div>
    </section>
  </div>
  <p class="note tnum">Cells ${size}px, gap ${gap}px. Hover or tap a day; tap it again to dismiss.</p>`;
  syncURL();updatePop();
}

/* ---------- tooltip ---------- */
function popHTML(k){
  const i=info(k),d=parseKey(k);
  const main=i.total?`<div class="p-main"><b class="tnum">${fmt(i.total)}</b> · ${plural(i.count,'check-in')}</div>`:`<div class="p-main">No check-ins</div>`;
  const rows=S.tip==='breakdown'&&i.total?HABITS.filter(h=>i.by[h.id]).map(h=>`<div class="p-row"><span class="dot" style="--h:${h.hue}"></span><span>${h.name}</span><span class="tnum">${fmt(i.by[h.id].m)}</span></div>`).join(''):'';
  return `<div class="p-date">${fmtDate(d)}${k===TODAY_KEY?' · Today':''}</div>${main}${rows}`;
}
function updatePop(){
  const pop=$('#pop'),k=HOVER??S.sel;
  const grid=$('.grid'),idx=k?S._cells.indexOf(k):-1,el=grid&&idx>=0?grid.children[idx]:null;
  if(!el){pop.hidden=true;return}
  pop.innerHTML=popHTML(k);pop.hidden=false;
  const r=el.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  const left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2));
  let top=r.top-h-8;if(top<8)top=r.bottom+8;
  pop.style.left=left+'px';pop.style.top=top+'px';
}
function cellAt(g,e){
  const r=g.getBoundingClientRect(),p=+g.dataset.size+ +g.dataset.gap;
  const col=Math.floor((e.clientX-r.left)/p),row=Math.floor((e.clientY-r.top)/p);
  if(col<0||row<0||row>6||col>=+g.dataset.n)return null;
  return S._cells[col*7+row]??null;
}

/* ---------- controls ---------- */
function syncControls(){
  document.querySelectorAll('[data-knob]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(String(S[g.dataset.knob])===b.dataset.v))));
  document.querySelectorAll('.chip').forEach(b=>{
    b.setAttribute('aria-pressed',String(b.dataset.habit===S.habit));
    if(b.dataset.habit==='all')b.style.setProperty('--h',hueAll());
  });
  document.documentElement.dataset.theme=S.theme;
}
function syncURL(){
  const p=new URLSearchParams({scale:S.scale,ws:S.ws,theme:S.theme,fcolor:S.fcolor,tip:S.tip,hue:S.hue,habit:S.habit,range:S.range});
  try{history.replaceState(null,'','?'+p)}catch(e){}
}
$('#knobGrid').innerHTML=KNOBS.map(k=>`<div class="knob"><span>${k.label}</span><div class="seg" data-knob="${k.key}">${k.opts.map(o=>`<button data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('');
$('#chips').innerHTML=[{id:'all',name:'All',hue:hueAll()},...HABITS].map(h=>`<button class="chip" data-habit="${h.id}" style="--h:${h.hue}"><span class="dot"></span>${h.name}</button>`).join('');
$('#knobGrid').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  S[b.closest('[data-knob]').dataset.knob]=b.dataset.v;render();
});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S.habit=b.dataset.habit;render()});
$('#view').addEventListener('click',e=>{
  const sg=e.target.closest('[data-range]');
  if(sg){S.range=Number(sg.dataset.range);render();return}
  const g=e.target.closest('.grid');if(!g)return;
  const k=cellAt(g,e);if(!k)return;
  S.sel=S.sel===k?null:k;render();
});
$('#view').addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  const g=e.target.closest('.grid'),k=g?cellAt(g,e):null;
  if(k!==HOVER){HOVER=k;updatePop()}
});
$('#view').addEventListener('pointerleave',()=>{HOVER=null;updatePop()});
addEventListener('scroll',updatePop,{passive:true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,100)});
render();
</script>
</body>
</html>
